<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App-icon container: rounded square, navy background, white mark + accent dot.
       A very restrained linear gradient is used here (background container only,
       never on the mark itself) per brand guide policy. -->
  <defs>
    <linearGradient id="squareBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111C33" />
      <stop offset="100%" stop-color="#0B1220" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#squareBg)" />
  <g id="apexlens-mark" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 92 418 L 256 130 L 420 418" stroke="#FFFFFF" stroke-width="66" />
    <circle cx="256" cy="130" r="42" fill="#3B82F6" stroke="none" />
  </g>
</svg>
