    <path d="M 92 418 L 256 130 L 420 418" stroke="#2563EB" stroke-width="66" />
    <circle cx="256" cy="130" r="42" fill="#3B82F6" stroke="none" />
  </g>
  <text x="260" y="168" font-family="Inter, sans-serif" font-weight="800" font-size="130" fill="#0F172A" letter-spacing="-2">ApexLens</text>
</svg>
