<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 240">
  <!-- Horizontal lockup for light/white backgrounds. Text uses font-family="Inter";
       the generation script embeds the real Inter font at rasterization time so
       PNG exports render correctly. This master file stays lightweight/editable
       and relies on the system Inter font when opened in Figma/Illustrator/Inkscape. -->
